<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Satya — The Other Side of Truth (WebAR)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  html { background: #000; }
  body { background: transparent; }  /* body must stay transparent or it paints over the camera video */
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Cinzel", Georgia, serif; }

  /* ---------- DVD menu start screen ---------- */
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #e8dcc8;
    background: radial-gradient(ellipse at 50% 50%, #2a0606 0%, #0e0202 60%, #000 100%);
    transition: opacity .6s;
  }
  #start.out { opacity: 0; pointer-events: none; }
  #start::before, #start::after { content: ""; position: absolute; left: 0; right: 0; height: 11vh; background: #000; z-index: 4; }
  #start::before { top: 0; } #start::after { bottom: 0; }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .12; mix-blend-mode: screen; pointer-events: none; z-index: 2; }
  #start .vig { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    box-shadow: inset 0 0 140px 40px #000; animation: flicker 4s infinite steps(1); }
  @keyframes flicker { 0%,100% {opacity:1} 47% {opacity:.85} 48% {opacity:1} 73% {opacity:.92} 74% {opacity:1} }
  #start .quote {
    position: absolute; left: 4%; top: 50%; width: 92%; transform: translateY(-50%); z-index: 1;
    mix-blend-mode: screen; opacity: .9; animation: projector 9s ease-in-out infinite alternate;
  }
  @keyframes projector { from { transform: translateY(-50%) scale(1); } to { transform: translateY(-50%) scale(1.03); } }
  #start .top, #start .bottom { position: absolute; left: 0; right: 0; z-index: 3; animation: fadein 2.2s ease both; }
  #start .top { top: calc(11vh + 6vh); }
  #start .bottom { bottom: calc(11vh + 6vh); animation-delay: .8s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #start .pre { font-size: 11px; letter-spacing: 4px; color: #a8957a; }
  #start h1 { font-family: "Playfair Display", serif; font-style: italic; font-size: 64px; margin: 4px 0 0;
    color: #c8141e; text-shadow: 0 0 24px rgba(200,20,30,.45), 2px 2px 0 #000; }
  #go {
    background: none; border: 0; color: #f3e6cc; font-family: "Cinzel", serif;
    font-size: 20px; letter-spacing: 4px; padding: 8px 18px; cursor: pointer;
    text-shadow: 0 0 10px rgba(255,210,150,.7); animation: glow 1.6s ease-in-out infinite;
  }
  #go .arrow { color: #c8141e; margin-right: 10px; animation: blink 1s steps(1) infinite; }
  #go:active { color: #fff; transform: scale(.97); }
  @keyframes glow { 50% { text-shadow: 0 0 18px rgba(255,210,150,1); } }
  @keyframes blink { 50% { opacity: 0; } }
  #start .foot { margin-top: 14px; font-size: 10px; letter-spacing: 2px; color: #7d6d58; font-family: Georgia, serif; }

  /* ---------- subtitle-style hint ---------- */
  #hint {
    position: fixed; left: 0; right: 0; top: 22px; z-index: 10; text-align: center;
    font-family: Georgia, serif; font-size: 16px; color: #fff59a;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  #hint.show { opacity: 1; }

  /* ---------- DVD chapter card ---------- */
  #card {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 15; max-width: 520px; margin: 0 auto;
    background: linear-gradient(180deg, rgba(30,6,6,.94), rgba(8,2,2,.96)); color: #e8dcc8;
    border: 1px solid #8a6d45; outline: 1px solid rgba(138,109,69,.35); outline-offset: 3px;
    padding: 18px 20px 14px; transform: translateY(140%); transition: transform .35s ease;
    max-height: 60vh; overflow-y: auto; box-sizing: border-box;
  }
  #card.open { transform: translateY(0); }
  #card .kicker { color: #c8141e; font-size: 11px; letter-spacing: 3px; }
  #card h2 { margin: 4px 0 10px; font-size: 19px; letter-spacing: 1px; color: #f3e6cc; font-weight: 700; }
  #card p { margin: 0; font-family: Georgia, serif; font-size: 14px; line-height: 1.55; color: #cbbda6; }
  #card .credit { margin-top: 8px; font-family: Georgia, serif; font-size: 11px; font-style: italic; color: #8a7a62; }
  #card .credit:empty { display: none; }
  #card button { background: none; border: 0; color: #f3e6cc; font-family: "Cinzel", serif; font-size: 14px;
    letter-spacing: 3px; padding: 12px 0 2px; text-shadow: 0 0 8px rgba(255,210,150,.6); }
  #card button .arrow { color: #c8141e; margin-right: 8px; }
</style>

<script>
/* ---------- Poster coordinate helper ----------
   Target image is 980 x 1358 px. MindAR scales the target to width = 1,
   so x runs -0.5..0.5 and y runs -0.693..0.693 (centre = 0,0). */
const IMG_W = 980, IMG_H = 1358;
function px(x, y) { return { x: x / IMG_W - 0.5, y: (IMG_H / 2 - y) / IMG_W }; }
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function tex(canvas) { const t = new THREE.CanvasTexture(canvas); if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; return t; }
function flatMat(map) { return new THREE.MeshBasicMaterial({ map, transparent: true, depthTest: false }); }

/* ---------- Gritty blood textures (drawn once in code) ---------- */
const Blood = {
  stem(seed) {                                   // ragged vertical streak
    const r = rng(seed), c = document.createElement('canvas'); c.width = 64; c.height = 512;
    const x = c.getContext('2d');
    let wob = 0;
    for (let y = 0; y < 512; y++) {
      wob += (r() - 0.5) * 1.6; wob *= 0.92;
      const pool = y < 50 ? (50 - y) * 0.25 : 0;            // wider where it seeps from the letter
      const hw = 15 + wob + pool + (r() - 0.5) * 2.5;
      const g = x.createLinearGradient(32 - hw, 0, 32 + hw, 0);
      g.addColorStop(0, '#2a0003'); g.addColorStop(0.3, '#7a0710'); g.addColorStop(0.42, '#b3202a');
      g.addColorStop(0.5, '#8a0a12'); g.addColorStop(1, '#260002');
      x.fillStyle = g; x.fillRect(32 - hw, y, hw * 2, 1);
    }
    for (let i = 0; i < 160; i++) {               // clots and grime
      x.fillStyle = `rgba(${20 + r() * 40},0,${r() * 6},${0.3 + r() * 0.5})`;
      x.fillRect(16 + r() * 32, r() * 512, 1 + r() * 3, 2 + r() * 10);
    }
    return tex(c);
  },
  drop(seed) {                                   // teardrop bulb with a wet highlight
    const r = rng(seed), c = document.createElement('canvas'); c.width = 64; c.height = 96;
    const x = c.getContext('2d');
    x.beginPath(); x.moveTo(32, 0);
    x.bezierCurveTo(36, 22, 58 + r() * 4, 40, 58, 64); x.arc(32, 64, 26, 0, Math.PI, false);
    x.bezierCurveTo(6 - r() * 4, 40, 28, 22, 32, 0); x.closePath();
    const g = x.createRadialGradient(24, 58, 2, 32, 64, 34);
    g.addColorStop(0, '#c2343c'); g.addColorStop(0.35, '#8c0b13'); g.addColorStop(1, '#2a0003');
    x.fillStyle = g; x.fill();
    x.fillStyle = 'rgba(255,220,220,.55)'; x.beginPath(); x.ellipse(22, 56, 4, 7, -0.4, 0, Math.PI * 2); x.fill();
    return tex(c);
  },
  splat(seed) {                                  // irregular splatter with satellite droplets
    const r = rng(seed), c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d'); x.translate(128, 128);
    const col = () => `rgba(${90 + r() * 70},${r() * 10},${r() * 14},${0.75 + r() * 0.25})`;
    x.fillStyle = col(); x.beginPath();
    const n = 14, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, rad = 28 + r() * 20 + (r() < 0.25 ? r() * 26 : 0); pts.push([Math.cos(a) * rad, Math.sin(a) * rad]); }
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let m0 = mid(pts[n - 1], pts[0]); x.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); x.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
    x.fill();
    for (let i = 0; i < 40; i++) {
      const a = r() * Math.PI * 2, d = 50 + r() * 70, s = 1 + r() * 6;
      x.fillStyle = col(); x.beginPath(); x.arc(Math.cos(a) * d, Math.sin(a) * d, s, 0, Math.PI * 2); x.fill();
      if (r() < 0.3) { x.save(); x.rotate(a); x.fillRect(40, -1.5, 30 + r() * 30, 3); x.restore(); }
    }
    return tex(c);
  }
};

/* ---------- Effect 1: glass cracks burst from the title ---------- */
AFRAME.registerComponent('crack-burst', {
  init() {
    const r = rng(7), group = new THREE.Group(), c = px(330, 500);
    const mat = new THREE.MeshBasicMaterial({ color: 0xf4f0ff, transparent: true, opacity: 0.9, depthTest: false });
    this.segs = [];
    const rays = 12;
    for (let i = 0; i < rays; i++) {
      let ang = (i / rays) * Math.PI * 2 + (r() - 0.5) * 0.5, x = c.x, y = c.y;
      const total = 0.12 + r() * 0.25, steps = 4;
      for (let k = 0; k < steps; k++) {
        const len = (total / steps) * (0.7 + r() * 0.6);
        ang += (r() - 0.5) * 0.7;
        const geo = new THREE.PlaneGeometry(len, 0.0045 - k * 0.0009); geo.translate(len / 2, 0, 0);
        const m = new THREE.Mesh(geo, mat); m.position.set(x, y, 0.004); m.rotation.z = ang; m.scale.x = 0.0001;
        m.renderOrder = 5; group.add(m);
        this.segs.push({ m, delay: i * 0.03 + k * 0.11 });
        x += Math.cos(ang) * len; y += Math.sin(ang) * len;
      }
    }
    this.flash = new THREE.Mesh(new THREE.CircleGeometry(0.06, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false }));
    this.flash.position.set(c.x, c.y, 0.005); this.flash.renderOrder = 6; group.add(this.flash);
    this.el.setObject3D('mesh', group);
    this.t = -1;
  },
  start() { this.t = 0; },
  tick(t, dt) {
    if (this.t < 0 || this.t > 3) return;
    this.t += dt / 1000;
    for (const s of this.segs) s.m.scale.x = Math.max(0.0001, Math.min(1, (this.t - s.delay) / 0.12));
    this.flash.material.opacity = Math.max(0, 0.9 - this.t * 3);
  }
});

/* ---------- Effect 2: the title bleeds (gritty, stop-start drips + splatter) ---------- */
AFRAME.registerComponent('title-bleed', {
  init() {
    const r = rng(42), group = new THREE.Group();
    const stems = [Blood.stem(1), Blood.stem(2), Blood.stem(3)];
    const drops = [Blood.drop(4), Blood.drop(5)];
    this.dropTex = drops;
    // drip start points along the bottom of the painted "Satya" strokes (image px)
    const starts = [[40,455],[70,450],[95,440],[130,448],[150,445],[205,418],[230,422],[262,415],
                    [290,420],[318,585],[372,425],[400,428],[430,415],[460,412],[490,405],[528,400]];
    this.drips = starts.map(([sx, sy], i) => {
      const p = px(sx, sy), thin = r() < 0.35, w = thin ? 0.003 + r() * 0.003 : 0.007 + r() * 0.009;
      const geo = new THREE.PlaneGeometry(w, 1); geo.translate(0, -0.5, 0);
      const stem = new THREE.Mesh(geo, flatMat(stems[i % 3])); stem.position.set(p.x, p.y + 0.006, 0.003); stem.scale.y = 0.0001;
      const bw = w * 2.1, bh = bw * 1.5;
      const bulb = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), flatMat(drops[i % 2]));
      bulb.position.set(p.x, p.y, 0.0031); bulb.visible = false;
      stem.renderOrder = bulb.renderOrder = 4;
      group.add(stem, bulb);
      return { stem, bulb, bh, x: p.x, y0: p.y + 0.006, w, len: 0, max: thin ? 0.02 + r() * 0.06 : 0.05 + r() * 0.13,
               v: 0.03 + r() * 0.05, pause: 0, delay: 0.5 + i * 0.09 + r() * 0.5, fell: false, r };
    });
    // splatter that bursts out with the glass crack
    this.splats = [[150, 300, 0.10], [470, 250, 0.08], [230, 480, 0.12], [400, 540, 0.07], [60, 360, 0.06]].map(([sx, sy, s], i) => {
      const p = px(sx, sy);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), flatMat(Blood.splat(10 + i)));
      m.position.set(p.x, p.y, 0.0025); m.rotation.z = r() * Math.PI * 2; m.scale.set(0.001, 0.001, 1);
      m.renderOrder = 3; group.add(m);
      return { m, delay: 0.05 + r() * 0.25 };
    });
    this.falling = [];
    this.group = group;
    this.el.setObject3D('mesh', group);
    this.t = -1;
  },
  start() { this.t = 0; },
  tick(t, dtMs) {
    if (this.t < 0) return;
    const dt = Math.min(dtMs / 1000, 0.05);
    this.t += dt;
    for (const s of this.splats) {
      const k = Math.max(0, Math.min(1, (this.t - s.delay) / 0.09));
      const e = 1 - Math.pow(1 - k, 3) || 0.001; s.m.scale.set(e, e, 1);
    }
    for (const d of this.drips) {
      if (this.t < d.delay) continue;
      if (d.len < d.max) {
        if (d.pause > 0) d.pause -= dt;
        else {
          d.len = Math.min(d.max, d.len + d.v * dt);
          d.v = Math.max(d.v * 0.996, 0.004);
          if (d.r() < 0.9 * dt) d.pause = 0.15 + d.r() * 0.6;   // blood stalls, then creeps on
        }
      } else if (!d.fell && d.w > 0.008 && d.r() < 0.4 * dt) {
        d.fell = true;                                            // a heavy drop breaks off and falls
        const m = new THREE.Mesh(new THREE.PlaneGeometry(d.w * 1.6, d.w * 2.4), flatMat(this.dropTex[0]));
        m.position.set(d.x, d.y0 - d.len - d.bh * 0.4, 0.0032); m.renderOrder = 4; this.group.add(m);
        this.falling.push({ m, vy: 0, dist: 0, max: 0.12 + d.r() * 0.2 });
      }
      d.stem.scale.y = d.len + 0.0001;
      d.bulb.visible = d.len > 0.004;
      d.bulb.position.y = d.y0 - d.len - d.bh * 0.5 + d.bh * 0.35;
    }
    for (const f of this.falling) {
      if (f.dist > f.max + 0.2) continue;
      f.vy += 0.9 * dt; f.m.position.y -= f.vy * dt; f.dist += f.vy * dt;
      f.m.material.opacity = Math.max(0, 1 - Math.max(0, f.dist - f.max) / 0.15);
    }
  }
});

/* ---------- Effect 3: skyline windows flicker ---------- */
AFRAME.registerComponent('skyline-lights', {
  init() {
    const r = rng(99), group = new THREE.Group();
    this.lights = [];
    for (let i = 0; i < 40; i++) {
      const p = px(10 + r() * 640, 570 + r() * 45);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0, depthTest: false });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.006, 0.008), mat);
      m.position.set(p.x, p.y, 0.002); m.renderOrder = 3; group.add(m);
      this.lights.push({ m, period: 1.5 + r() * 4, phase: r() * 10 });
    }
    this.el.setObject3D('mesh', group);
    this.on = false; this.time = 0;
  },
  start() { this.on = true; },
  tick(t, dt) {
    if (!this.on) return;
    this.time += dt / 1000;
    for (const l of this.lights) {
      const v = Math.sin((this.time + l.phase) * (Math.PI * 2 / l.period));
      l.m.material.opacity = v > 0.2 ? (Math.random() < 0.03 ? 0.2 : 0.95) : 0;
    }
  }
});

        <path d="M30 38.5 L38 36.5 L41 47.5 L33 49.5Z M46 34.5 L54 32.5 L57 43.5 L49 45.5Z M62 30.5 L70 28.5 L73 39.5 L65 41.5Z" fill="${INK}"/>

        <circle cx="39.4" cy="64.6" r="9"/><circle cx="32.9" cy="44.4" r="9"/><circle cx="50" cy="50" r="4"/></g>`,

        <rect x="45" y="62" width="10" height="12"/><rect x="32" y="74" width="36" height="9" rx="2"/></g>
        <path d="M30 24 Q14 24 18 38 Q22 48 33 48 M70 24 Q86 24 82 38 Q78 48 67 48" stroke="${GOLD}" stroke-width="5" fill="none"/>`

AFRAME.registerComponent('badge-icon', {
  schema: { icon: { type: 'string' } },
  init() {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    const base = () => {
      x.clearRect(0, 0, S, S);
      x.fillStyle = 'rgba(18,4,4,0.92)'; x.beginPath(); x.arc(S / 2, S / 2, 118, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#b08a55'; x.lineWidth = 7; x.stroke();
    };
    base();
    const t = tex(c);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.11), flatMat(t));
    mesh.renderOrder = 8; this.el.setObject3D('mesh', mesh);
    const img = new Image();
    img.onload = () => { base(); x.drawImage(img, 48, 48, 160, 160); t.needsUpdate = true; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">${ICONS[this.data.icon]}</svg>`);
  }
});

/* ---------- Chapters (info cards) ---------- */
const INFO = {
  synopsis: { kicker: 'Synopsis', title: 'Satya (1998)',
    body: 'Satya, a young man with no past, arrives in Bombay looking for work. After a clash with a local thug lands him in jail, he meets the volatile gangster Bhiku Mhatre and is drawn into his gang. As Satya rises through the underworld, he falls for his neighbour Vidya, who knows nothing of his other life, until gang war, the police and politics close in on them all. Written by Saurabh Shukla and Anurag Kashyap; released 3 July 1998.' },
  rgv: { kicker: 'The director', title: 'Ram Gopal Varma',
    body: 'The Telugu filmmaker who broke through with Shiva (1989) produced and directed Satya, shooting it on real Mumbai streets on a budget of about ₹2.5 crore. The film opens with his note: "My tears for Satya are as much as they are for the people whom he killed."' },
  satya: { kicker: 'Character', title: 'Satya — J. D. Chakravarthy',
    body: 'An outsider with no past and few words. Quiet, calculating and loyal, he becomes the gang\'s sharpest mind while hiding that life from the woman he loves.' },
  vidya: { kicker: 'Character', title: 'Vidya — Urmila Matondkar',
    body: 'Satya\'s neighbour and an aspiring singer. Their quiet romance and its songs play against the violence of the gang world. Matondkar was nominated for the Filmfare Best Actress award.' },
  bhiku: { kicker: 'Character', title: 'Bhiku Mhatre — Manoj Bajpayee',
    body: 'Loud, hot-headed and fiercely loyal, the gang leader who befriends Satya in jail. His cry "Mumbai ka King kaun? Bhiku Mhatre!" became one of Hindi cinema\'s most quoted lines, and the role won Bajpayee the National Film Award for Best Supporting Actor.' },
  chase: { kicker: 'Behind the camera', title: 'Guerrilla filmmaking',
    body: 'Shot by Gerard Hooper and Mazhar Kamran (printed "Hamran" on this poster). Kamran used available light and a small crew so they could film on real Mumbai streets without being mobbed.' },
  credits: { kicker: 'Sound', title: 'Music',
    body: 'Songs composed by Vishal Bhardwaj with lyrics by Gulzar. The background score is by Sandeep Chowta.' },
  legacy: { kicker: 'Legacy', title: 'Redefining Indian noir',
    body: 'Satya won six Filmfare Awards and a National Film Award, launched the careers of Manoj Bajpayee and Anurag Kashyap, and began Varma\'s Gangster trilogy with Company and D.' }
};
// [id, icon, x, y] in poster pixels; order = chapter number
const SPOTS = [
  ['synopsis', 'clapper', 290, 330], ['rgv', 'camera', 330, 175], ['satya', 'gun', 880, 250],
  ['vidya', 'rose', 560, 790], ['bhiku', 'crown', 520, 555], ['chase', 'reel', 180, 720],
  ['credits', 'music', 70, 1280], ['legacy', 'trophy', 75, 45]
];

/* ---------- Vintage TV screen: bezel + live video texture, drawn above all effects ---------- */
AFRAME.registerComponent('scene-screen', {
  init() {
    const g = new THREE.Group();
    const plane = (w, h, color, z, order) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true }));
      m.position.z = z; m.renderOrder = order; g.add(m); return m;
    };
    plane(0.98, 0.56, 0x0b0505, 0, 20);
    plane(0.952, 0.532, 0x8a6d45, 0.001, 21);
    plane(0.94, 0.52, 0x000000, 0.002, 22);
    const video = document.getElementById('scene-vid');
    const vt = new THREE.VideoTexture(video);
    if ('colorSpace' in vt) vt.colorSpace = THREE.SRGBColorSpace;
    vt.minFilter = THREE.LinearFilter; vt.magFilter = THREE.LinearFilter; vt.generateMipmaps = false;
    this.screen = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.485),
      new THREE.MeshBasicMaterial({ map: vt, depthTest: false, transparent: true }));
    this.screen.position.z = 0.003; this.screen.renderOrder = 23; g.add(this.screen);
    this.vt = vt; this.video = video;
    this.el.setObject3D('mesh', g);
  },
  tick() {   // keep the frame fresh even where requestVideoFrameCallback is missing
    if (this.video.readyState >= 2 && !this.video.paused) this.vt.needsUpdate = true;
  }
});

// Movie clips for each chapter (assets/<name>.mp4). Chapters without one just show the card.
const CLIPS = { synopsis: 'synopsis', rgv: 'rgv', satya: 'satya', vidya: 'vidya', bhiku: 'bhiku', credits: 'music' };

const scenePlayer = {
  playing: null,
  play(id) {
    const v = document.getElementById('scene-vid'), screen = document.getElementById('screen');
    if (!CLIPS[id]) { this.stop(); return; }
    if (this.playing !== id) { v.src = `assets/${CLIPS[id]}.mp4`; v.load(); }
    this.playing = id;
    v.currentTime = 0;
    v.play().catch(() => {});
    screen.setAttribute('visible', 'true');
    screen.setAttribute('animation__pop', 'property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: 350; easing: easeOutBack');
    sfx.fade(false);                                  // duck the background music
  },
  stop() {
    const v = document.getElementById('scene-vid');
    v.pause();
    document.getElementById('screen').setAttribute('visible', 'false');
    if (this.playing && window.__tracking) sfx.fade(true);
    this.playing = null;
  }
};

AFRAME.registerComponent('hotspot', {
  schema: { id: { type: 'string' } },
  init() {
    this.el.addEventListener('click', () => {
      if (!window.__tracking) return;
      sfx.tick();
      openCard(this.data.id);
      scenePlayer.play(this.data.id);
    });
  }
});

/* ---------- Audio: noir drone + glass crack (synthesised, no files needed) ---------- */
const sfx = {
  ctx: null, master: null, theme: null,
  init() {
    // Optional: put your own track at assets/theme.mp3 and it replaces the drone.
    this.theme = new Audio('assets/theme.mp3'); this.theme.loop = true; this.theme.volume = 0;
    this.theme.addEventListener('error', () => { this.theme = null; });
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0; this.master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280; lp.connect(this.master);
    [55, 55.4, 82.4].forEach(f => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.06; o.connect(g); g.connect(lp); o.start();
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
    const lg = ctx.createGain(); lg.gain.value = 120; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  },
  fade(on) {
    if (this.theme) {
      if (on) this.theme.play().catch(() => {});
      const target = on ? 0.8 : 0, a = this.theme;
      clearInterval(this._fi);
      this._fi = setInterval(() => {
        a.volume = Math.max(0, Math.min(1, a.volume + (target > a.volume ? 0.05 : -0.05)));
        if (Math.abs(a.volume - target) < 0.06) { a.volume = target; clearInterval(this._fi); if (!on) a.pause(); }
      }, 60);
      return;
    }
    if (!this.ctx) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(on ? 0.9 : 0, t + (on ? 2 : 0.6));
  },
  noise(dur, hp, vol) {
    if (!this.ctx) return;
    const ctx = this.ctx, buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start();
  },
  crack() { this.noise(0.5, 1800, 0.8); setTimeout(() => this.noise(0.25, 3000, 0.4), 120); },
  tick() { this.noise(0.05, 4000, 0.3); }
};

/* ---------- UI helpers ---------- */
function openCard(id) {
  const i = INFO[id], card = document.getElementById('card');
  const n = SPOTS.findIndex(sp => sp[0] === id) + 1;
  card.querySelector('.kicker').textContent = `CHAPTER ${String(n).padStart(2, '0')} · ${i.kicker.toUpperCase()}`;
  card.querySelector('h2').textContent = i.title;
  card.querySelector('p').textContent = i.body;
  card.querySelector('.credit').textContent = CLIPS[id] ? 'Clip from Satya (1998), dir. Ram Gopal Varma' : '';
  card.scrollTop = 0;
  card.classList.add('open');
}
function hint(text, ms) {
  const h = document.getElementById('hint'); h.textContent = text; h.classList.add('show');
  clearTimeout(h._t); if (ms) h._t = setTimeout(() => h.classList.remove('show'), ms);
}
</script>
</head>

<body>
<div id="start">
  <canvas id="grain"></canvas>
  <img class="quote" src="assets/quote.jpg" alt="">
  <div class="vig"></div>
  <div class="top">
    <div class="pre">RAM GOPAL VARMA'S</div>
    <h1>Satya</h1>
  </div>
  <div class="bottom">
    <button id="go"><span class="arrow">▶</span>PLAY MOVIE</button>
    <div class="foot">POINT YOUR CAMERA AT THE POSTER · SOUND ON</div>
  </div>
</div>
<div id="hint"></div>
<video id="scene-vid" playsinline webkit-playsinline preload="auto"
  style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1"></video>
<div id="card"><div class="kicker"></div><h2></h2><p></p><div class="credit"></div><button id="close"><span class="arrow">◀</span>RESUME</button></div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="cracks" crack-burst></a-entity>
    <a-entity id="bleed" title-bleed></a-entity>
    <a-entity id="lights" skyline-lights></a-entity>
    <a-entity id="spots"></a-entity>
    <!-- vintage TV screen that pops out in front of the poster -->
    <a-entity id="screen" position="0 0.12 0.12" visible="false" scene-screen></a-entity>
  </a-entity>
</a-scene>

<script>
const scene = document.querySelector('a-scene');
const target = document.getElementById('target');
const spots = document.getElementById('spots');
let played = false;

// Film grain on the menu
(() => {
  const c = document.getElementById('grain'), x = c.getContext('2d');
  c.width = 160; c.height = 284;
  const img = x.createImageData(c.width, c.height);
  (function loop() {
    if (document.getElementById('start').classList.contains('out')) return;
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
    x.putImageData(img, 0, 0); setTimeout(() => requestAnimationFrame(loop), 50);
  })();
})();

// Build the hotspots
SPOTS.forEach(([id, icon, x, y]) => {
  const p = px(x, y);
  const e = document.createElement('a-entity');
  e.setAttribute('position', `${p.x} ${p.y} 0.01`);
  e.setAttribute('visible', 'false');
  e.innerHTML = `
    <a-ring radius-inner="0.058" radius-outer="0.064" color="#c8141e" material="shader: flat; transparent: true; opacity: 0.85"
      animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"></a-ring>
    <a-entity badge-icon="icon: ${icon}"></a-entity>
    <a-circle class="clickable" hotspot="id: ${id}" radius="0.075" material="shader: flat; transparent: true; opacity: 0"></a-circle>`;
  spots.appendChild(e);
});

function showSpots() {
  [...spots.children].forEach((e, i) => setTimeout(() => {
    e.setAttribute('visible', 'true');
    e.setAttribute('animation__in', 'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 400; easing: easeOutBack');
  }, i * 150));
}

target.addEventListener('targetFound', () => {
  window.__tracking = true;
  const v = document.getElementById('scene-vid');
  if (scenePlayer.playing && v.paused && !v.ended) v.play().catch(() => {});
  if (!scenePlayer.playing) sfx.fade(true);
  hint('', 1);
  if (!played) {
    played = true;
    sfx.crack();
    document.getElementById('cracks').components['crack-burst'].start();
    document.getElementById('bleed').components['title-bleed'].start();
    document.getElementById('lights').components['skyline-lights'].start();
    setTimeout(showSpots, 2200);
    setTimeout(() => hint('Tap the icons to explore', 4000), 3600);
  }
});
target.addEventListener('targetLost', () => {
  window.__tracking = false;
  document.getElementById('scene-vid').pause();
  sfx.fade(false);
});

document.getElementById('go').addEventListener('click', () => {
  sfx.init();
  if (sfx.ctx.state === 'suspended') sfx.ctx.resume();
  if (sfx.theme) sfx.theme.play().then(() => sfx.theme.pause()).catch(() => {}); // unlock on iOS
  // DVD remote "select" blip
  const o = sfx.ctx.createOscillator(), g = sfx.ctx.createGain(), t = sfx.ctx.currentTime;
  o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.06);
  g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(sfx.ctx.destination); o.start(t); o.stop(t + 0.2);
  const st = document.getElementById('start'); st.classList.add('out');
  setTimeout(() => st.style.display = 'none', 650);
  const run = () => scene.systems['mindar-image-system'].start();
  scene.hasLoaded ? run() : scene.addEventListener('loaded', run);
});
document.getElementById('close').addEventListener('click', () => {
  document.getElementById('card').classList.remove('open');
  scenePlayer.stop();
});
document.getElementById('scene-vid').addEventListener('ended', () => scenePlayer.stop());
</script>
</body>
</html>
